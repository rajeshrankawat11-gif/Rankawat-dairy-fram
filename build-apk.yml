name: Build Rankawat Dairy Farm APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android source ZIP
        run: |
          set -e
          curl -L --fail \
            -o source.zip \
            "https://raw.githubusercontent.com/rajeshrankawat11-gif/Rankawat-dairy-farm/main/rankawat-dairy-farm-v1-android-source.zip"
          rm -rf project
          mkdir project
          unzip -q source.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk Rankawat-Dairy-Farm.apk
          ls -lh Rankawat-Dairy-Farm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rankawat-Dairy-Farm-APK
          path: Rankawat-Dairy-Farm.apk
          if-no-files-found: error
